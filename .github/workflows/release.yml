name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    name: verify release version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: verify release version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -notmatch 'project\(nori VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)') {
              throw 'Could not determine the project version from CMakeLists.txt.'
          }

          $projectVersion = $Matches[1]
          $tagVersion = $env:TAG_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
              throw "Tag version $tagVersion does not match project version $projectVersion."
          }

          "version=$projectVersion" >> $env:GITHUB_OUTPUT

  package:
    name: ${{ matrix.name }}
    needs: verify-version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: package windows x64 (msvc 145)
            os: windows-2025-vs2026
            workflow: package
            build-preset: windows-package-x64
            artifact-name: windows-release-x64
            package-pattern: nori-*-windows-msvc145-x64.zip
          - name: package linux x64 (gcc 16)
            os: ubuntu-24.04
            workflow: linux-package
            build-preset: linux-package-x64
            artifact-name: linux-release-x64
            package-pattern: nori-*-linux-gcc16-x64.zip

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup cmake
        if: runner.os == 'Linux'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: install gcc 16
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: cache cmake dependencies
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.build-preset }}/_deps
          key: ${{ runner.os }}-${{ matrix.build-preset }}-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build-preset }}-deps-

      - name: build and package
        run: cmake --workflow --preset ${{ matrix.workflow }}

      - name: upload release package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.package-pattern }}
          if-no-files-found: error

  publish:
    name: publish release
    needs:
      - verify-version
      - package
    runs-on: ubuntu-24.04

    steps:
      - name: download release packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: verify release packages
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(dist/*.zip)
          if (( ${#packages[@]} != 2 )); then
            echo "Expected exactly two release packages in dist, but found ${#packages[@]}." >&2
            exit 1
          fi
          test -f "dist/nori-$VERSION-windows-msvc145-x64.zip"
          test -f "dist/nori-$VERSION-linux-gcc16-x64.zip"

      - name: create github release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" dist/*.zip \
              --verify-tag \
              --title "nori $VERSION" \
              --generate-notes
